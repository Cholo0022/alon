name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm run lint && npm run format:check && npm test && npm audit --audit-level=high
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: alon_validation
          MYSQL_ROOT_PASSWORD: integration_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ALON_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/alon_validation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
      ALON_TEST_MYSQL_USER: root
      ALON_TEST_MYSQL_PASSWORD: integration_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode verify
        working-directory: backend
