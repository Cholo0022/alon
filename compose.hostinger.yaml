services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alon
      MYSQL_USER: alon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u alon -p\"$$MYSQL_PASSWORD\" alon -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/alon?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_USERNAME: alon
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      ALON_PROVISIONING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    mem_limit: 1g
    volumes:
      - api_data:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql_data:
  api_data:
