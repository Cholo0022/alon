spring.application.name=alon-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alon_local}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.address=${SERVER_ADDRESS:127.0.0.1}

spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
alon.local-accounts=false
alon.bootstrap-store-id=${ALON_BOOTSTRAP_STORE_ID:1}
alon.images-directory=${ALON_IMAGES_DIRECTORY:./data/article-images}
alon.shop.hero-image=${ALON_SHOP_HERO_IMAGE:}
server.tomcat.max-http-form-post-size=8MB
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'

# La clave cifra secretos TOTP y se respalda por separado de la base de datos.
alon.security-key-file=${ALON_SECURITY_KEY_FILE:./data/security/mfa.key}
alon.security-mail-from=${ALON_SECURITY_MAIL_FROM:}
spring.mail.host=${ALON_SMTP_HOST:}
spring.mail.port=${ALON_SMTP_PORT:587}
spring.mail.username=${ALON_SMTP_USERNAME:}
spring.mail.password=${ALON_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${ALON_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

alon.require-ip-approval=${ALON_REQUIRE_IP_APPROVAL:true}

# El correo es opcional; su configuración y fallos se informan en Seguridad de ingreso.
management.health.mail.enabled=false
