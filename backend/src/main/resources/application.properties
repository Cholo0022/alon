spring.application.name=alon-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alon_local}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.address=${SERVER_ADDRESS:127.0.0.1}

spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
alon.local-accounts=false
alon.bootstrap-store-id=${ALON_BOOTSTRAP_STORE_ID:1}
alon.images-directory=${ALON_IMAGES_DIRECTORY:./data/article-images}
alon.shop.hero-image=${ALON_SHOP_HERO_IMAGE:}
server.tomcat.max-http-form-post-size=8MB
spring.datasource.hikari.connection-init-sql=SET time_zone = '-03:00'
