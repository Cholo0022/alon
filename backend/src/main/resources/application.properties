spring.application.name=alon-api
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alon_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.address=${SERVER_ADDRESS:127.0.0.1}

