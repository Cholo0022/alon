server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 513m;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $alon_api http://api:8080;
        proxy_pass $alon_api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
