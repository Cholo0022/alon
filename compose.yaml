services:
  mysql:
    image: mysql:8.4
    container_name: alon-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alon}
      MYSQL_USER: ${MYSQL_USER:-alon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-alon_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - alon_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  alon_mysql_data:
